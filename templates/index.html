<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Dream AI Chat</title>
    <style>
        body { background: #050505; color: #00FF00; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        #chat { width: 350px; height: 400px; border: 1px solid #00FF00; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        input { width: 300px; padding: 5px; background: #000; color: #00FF00; border: 1px solid #00FF00; }
        button { padding: 5px 10px; background: #00FF00; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h3>Dream AI</h3>
    <div id="chat"></div>
    <div>
        <input type="text" id="msg" placeholder="Твой вопрос...">
        <button onclick="send()">Send</button>
    </div>

    <script>
        async function send() {
            let msg = document.getElementById('msg').value;
            let chat = document.getElementById('chat');
            chat.innerHTML += `<p><b>Ты:</b> ${msg}</p>`;
            
            let res = await fetch('/ask', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg})
            });
            let data = await res.json();
            chat.innerHTML += `<p><b>Dream:</b> ${data.response}</p>`;
            document.getElementById('msg').value = '';
        }
    </script>
</body>
</html>
